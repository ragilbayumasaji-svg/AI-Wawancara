<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wawancara AI Interaktif + Panel Guru BK</title>

<!-- Tailwind CSS, Alpine.js, Chart.js, html2pdf.js, SheetJS, SweetAlert2 -->
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- MediaPipe Script Tags -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  [x-cloak] { display: none !important; }
  html, body { background:#F5F5F5; color:#212121; font-family:'Inter', sans-serif; height:100%; }
  /* Custom Scrollbar untuk Chat */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D6D6D6; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #B8B8B8; }
  .glass-card {
    background: #FFFFFF;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  }
</style>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['"Inter"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
        colors: {
          ink: { 950:'#FFFFFF', 900:'#FFFFFF', 850:'#FAFAFA', 800:'#F0F0F0', 700:'#E4E4E4', 600:'#D4D4D4' },
          maroon: { 50:'#FBEAEA', 100:'#F3D2D2', 600:'#800000', 700:'#660000' },
          crimson: { 500:'#DC143C', 600:'#C21235' }
        }
      }
    }
  }
</script>
</head>
<body class="bg-[#F5F5F5] text-[#212121] antialiased selection:bg-maroon-100 h-screen overflow-hidden">

<div x-data="interviewApp()" x-init="init()" class="h-screen flex flex-col">
  
  <header class="border-b-2 border-maroon-700 bg-maroon-600 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center border border-white/30">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <h1 class="text-lg font-display font-bold text-white tracking-tight">AI Counselor BK</h1>
      </div>
      <div class="flex items-center space-x-4">
        <div x-show="interviewStarted" class="px-3 py-1 rounded-full bg-white/15 border border-white/30 text-[11px] font-mono flex items-center text-white" x-cloak>
          <span class="w-1.5 h-1.5 bg-emerald-300 rounded-full mr-2 animate-pulse"></span>
          Room: <span x-text="roomId" class="ml-1 font-semibold text-white"></span>
        </div>
        <button x-show="userRole === 'murid' && !interviewStarted" @click="attemptAdminAccess('teacher')" class="text-xs bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg border border-white/30 transition">
          🔒 Panel Guru BK
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-3 relative flex flex-col overflow-hidden">

    <!-- VIEW: PERSIAPAN -->
    <div x-show="currentView === 'candidate' && !interviewStarted" x-cloak class="max-w-md mx-auto w-full m-auto">
      <div class="glass-card p-8 rounded-2xl border border-gray-200 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-maroon-600"></div>
        <div class="text-center mb-6">
          <h2 class="text-2xl font-display font-bold text-[#212121] mb-2">Sesi Konseling AI</h2>
          <p class="text-sm text-gray-500">Silakan masukkan nama untuk memulai percakapan santai dengan Kak Rama.</p>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Nama Panggilan</label>
            <input type="text" x-model="studentName" placeholder="Contoh: Budi" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-[#212121] focus:outline-none focus:border-maroon-600 transition">
          </div>
          <label class="flex items-start space-x-3 cursor-pointer group">
            <div class="relative flex items-center justify-center mt-0.5">
              <input type="checkbox" x-model="agreeCheckbox" class="peer sr-only">
              <div class="w-5 h-5 rounded border-2 border-gray-300 peer-checked:bg-maroon-600 peer-checked:border-maroon-600 transition"></div>
              <svg class="absolute w-3 h-3 text-white opacity-0 peer-checked:opacity-100 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <span class="text-xs text-gray-500 group-hover:text-gray-700 transition">Saya setuju untuk mengaktifkan kamera dan mikrofon selama sesi ini berlangsung.</span>
          </label>
          <button @click="giveConsent()" :disabled="!agreeCheckbox || !studentName.trim() || modelLoading" class="w-full bg-crimson-500 hover:bg-crimson-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition flex items-center justify-center">
            <span x-show="!modelLoading">Mulai Sekarang</span>
            <span x-show="modelLoading" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
              Menyiapkan Kamera...
            </span>
          </button>
        </div>
      </div>
    </div>

    <!-- VIEW: WAWANCARA / CHAT INTERFACE -->
    <div x-show="interviewStarted && !interviewFinished" x-cloak class="grid grid-cols-1 lg:grid-cols-12 gap-4 h-[85vh] w-full">
      
      <!-- KOLOM KIRI: VIDEO WEBCAM & DETEKSI -->
      <div class="lg:col-span-5 flex flex-col space-y-4 h-full">
        <div class="relative bg-[#212121] rounded-2xl overflow-hidden border border-gray-200 shadow-md flex-1 min-h-0 flex items-center justify-center">
          <video x-ref="video" id="webcamVideo" autoplay muted playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
          <div class="absolute top-4 left-4 bg-black/60 px-3 py-1.5 rounded-full flex items-center space-x-2 border border-white/10">
            <div class="w-2 h-2 rounded-full" :class="faceDetected ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'"></div>
            <span class="text-[11px] font-medium text-white" x-text="faceDetected ? 'Wajah Terdeteksi' : 'Mencari Wajah...'"></span>
          </div>
        </div>
        
        <!-- Telemetri Stres & Ekspresi -->
        <div class="grid grid-cols-2 gap-4 flex-shrink-0">
          <div class="glass-card rounded-xl p-4 flex flex-col items-center justify-center space-y-1 border border-gray-200">
            <span class="text-[10px] uppercase tracking-wider text-gray-500">Tingkat Stres</span>
            <span class="text-2xl font-bold font-mono" :class="liveTelemetry.stress > 50 ? 'text-rose-600' : 'text-emerald-600'" x-text="(liveTelemetry.stress || 0) + '%'"></span>
          </div>
          <div class="glass-card rounded-xl p-4 flex flex-col items-center justify-center space-y-1 border border-gray-200">
            <span class="text-[10px] uppercase tracking-wider text-gray-500">Ekspresi Wajah</span>
            <span class="text-sm font-semibold text-maroon-600 capitalize text-center" x-text="liveTelemetry.expression || 'Netral'"></span>
          </div>
        </div>
      </div>

      <!-- KOLOM KANAN: CHAT INTERFACE -->
      <div class="lg:col-span-7 glass-card rounded-2xl border border-gray-200 flex flex-col h-full overflow-hidden">
        
        <!-- Header Chat -->
        <div class="px-6 py-4 bg-maroon-600 border-b border-maroon-700 flex justify-between items-center z-10">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white/15 rounded-full flex items-center justify-center border border-white/30 text-xl">🧑‍🏫</div>
            <div>
              <h2 class="text-sm font-bold text-white">Kak Rama</h2>
              <p class="text-[11px] text-emerald-200 flex items-center">
                <span class="w-1.5 h-1.5 bg-emerald-300 rounded-full mr-1.5 animate-pulse"></span>
                <span x-text="aiState === 'listening' ? 'Mendengarkan...' : (aiState === 'thinking' ? 'Mengetik...' : 'Online')"></span>
              </p>
            </div>
          </div>
        </div>

        <!-- Area Obrolan (Chat History) -->
        <div class="flex-1 overflow-y-auto p-6 space-y-4" id="chat-container">
          <div class="flex flex-col items-start">
            <div class="max-w-[80%] rounded-2xl px-4 py-2.5 text-sm bg-gray-100 border border-gray-200 text-[#212121] rounded-bl-none">
              <p x-text="`Halo ${studentName}! Santai aja ya obrolan kita hari ini.`"></p>
            </div>
          </div>
          <template x-for="(msg, index) in chatHistory" :key="index">
            <div class="flex flex-col" :class="msg.role === 'user' ? 'items-end' : 'items-start'">
              <div class="max-w-[80%] rounded-2xl px-4 py-3 text-sm shadow-sm"
                   :class="msg.role === 'user' ? 'bg-maroon-600 text-white rounded-br-none' : 'bg-gray-100 border border-gray-200 text-[#212121] rounded-bl-none'">
                <p x-text="msg.content"></p>
              </div>
              <span class="text-[10px] text-gray-400 mt-1" x-text="msg.role === 'user' ? 'Kamu' : 'Kak Rama'"></span>
            </div>
          </template>
          
          <div x-show="aiState === 'thinking'" class="flex items-start">
            <div class="bg-gray-100 border border-gray-200 rounded-2xl rounded-bl-none px-4 py-3 shadow-sm">
              <div class="flex space-x-1.5">
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Area Input Teks & Voice -->
        <div class="p-4 bg-white border-t border-gray-200">
          <div class="flex space-x-2">
            <button @click="toggleMic()"
                    class="p-3 rounded-xl transition flex-shrink-0 flex items-center justify-center w-12 h-12"
                    :class="isListening ? 'bg-rose-100 text-rose-600 border border-rose-300 animate-pulse' : 'bg-gray-100 text-gray-500 hover:text-[#212121] border border-gray-300'">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>
            <input type="text" x-model="currentAnswerText" @keydown.enter="submitAnswer()"
                   placeholder="Ketik curhatan lu di sini (atau pakai mic)..."
                   class="flex-1 bg-gray-50 border border-gray-300 rounded-xl px-4 text-sm text-[#212121] placeholder-gray-400 focus:outline-none focus:border-maroon-600 transition">
            <button @click="submitAnswer()" :disabled="!currentAnswerText.trim() || aiState === 'thinking'"
                    class="bg-crimson-500 hover:bg-crimson-600 disabled:opacity-50 text-white px-5 rounded-xl text-sm font-semibold transition flex-shrink-0 h-12">
              Kirim
            </button>
          </div>
          <p x-show="isListening" class="text-rose-600 text-[10px] mt-2 animate-pulse ml-14">Mendengarkan suaramu...</p>
        </div>
      </div>
    </div>

    <!-- VIEW: SELESAI -->
    <div x-show="interviewFinished && currentView === 'candidate'" x-cloak class="max-w-md mx-auto text-center glass-card p-8 rounded-2xl border border-gray-200 m-auto">
      <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-200">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <h2 class="text-2xl font-display font-bold text-[#212121] mb-2">Sesi Selesai!</h2>
      <p class="text-gray-500 text-sm mb-6">Terima kasih <span x-text="studentName" class="font-semibold text-[#212121]"></span> sudah berbagi cerita. Kak Rama pamit dulu ya, sehat selalu!</p>
      <button @click="window.location.reload()" class="bg-gray-100 hover:bg-gray-200 text-[#212121] px-6 py-2.5 rounded-xl text-sm font-semibold transition border border-gray-300">Kembali ke Awal</button>
    </div>

  </main>
</div>

<script>
let INITIAL_QUESTIONS = [
  "Bagaimana perasaanmu tentang sekolah dan pelajaran akhir-akhir ini?",
  "Kalau lagi ada masalah atau ngerasa capek, biasanya kamu cerita ke siapa atau ngapain?",
  "Apa hal atau pencapaian yang paling ingin kamu raih dalam waktu dekat ini?"
];

let faceMeshInstance = null;
let cameraInstance = null;

function interviewApp() {
  return {
    agreeCheckbox: false, consentGiven: false, modelLoading: false, faceDetected: false, studentName: '',
    userRole: 'murid', roomId: 'SISWA01', currentView: 'candidate',
    interviewStarted: false, interviewFinished: false,
    readinessState: 'waiting', aiState: 'idle',
    currentStep: 0, currentQuestionText: '', currentAnswerText: '', baseAnswerText: '',
    
    telemetryLogs: [], currentQuestionSamples: [], timelineData: [],
    liveTelemetry: { stress: 0, gaze: 'Depan', expression: 'Neutral / Santai' },
    chatHistory: [], 
    
    isListening: false, recognition: null, availableVoices: [], selectedVoiceIndex: 0,

    async init() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('room')) this.roomId = urlParams.get('room');
      
      this.initSpeechRecognition();
      this.initVoiceEngine();
    },

    initVoiceEngine() {
      const loadVoices = () => {
        if ('speechSynthesis' in window) {
          this.availableVoices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('id'));
        }
      };
      loadVoices();
      if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = loadVoices;
    },

    initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        this.recognition = new SpeechRecognition();
        this.recognition.continuous = true;
        this.recognition.interimResults = true;
        this.recognition.lang = 'id-ID';

        this.recognition.onresult = (event) => {
          if ('speechSynthesis' in window && window.speechSynthesis.speaking) return;
          let interimTranscript = ''; let finalTranscript = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
            else interimTranscript += event.results[i][0].transcript;
          }
          if (finalTranscript) {
            this.baseAnswerText = this.baseAnswerText ? (this.baseAnswerText + ' ' + finalTranscript) : finalTranscript;
            this.currentAnswerText = this.baseAnswerText;
          } else if (interimTranscript) {
            this.currentAnswerText = this.baseAnswerText ? (this.baseAnswerText + ' ' + interimTranscript) : interimTranscript;
          }
        };
        this.recognition.onerror = () => { this.isListening = false; };
        this.recognition.onend = () => { if (this.isListening && !window.speechSynthesis.speaking) try { this.recognition.start(); } catch(e){} };
      }
    },

    async startListening() {
      if (!this.recognition || ('speechSynthesis' in window && window.speechSynthesis.speaking)) return;
      this.isListening = true; this.aiState = 'listening';
      try { this.recognition.start(); } catch(e) {}
    },

    stopListening() {
      this.isListening = false;
      if (this.recognition) try { this.recognition.stop(); } catch(e) {}
    },

    toggleMic() {
      if (!this.recognition) return Swal.fire('Error', 'Browser tidak mendukung Voice Input.', 'info');
      if (this.isListening) {
        this.stopListening(); this.aiState = 'idle'; this.baseAnswerText = this.currentAnswerText.trim();
      } else {
        this.baseAnswerText = this.currentAnswerText.trim(); this.startListening();
      }
    },

    scrollToBottom() {
      setTimeout(() => {
        const container = document.getElementById('chat-container');
        if (container) container.scrollTop = container.scrollHeight;
      }, 100);
    },

    speakQuestion(text, onEndCallback = null) {
      if ('speechSynthesis' in window) {
        this.stopListening(); window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        if (this.availableVoices.length > 0) utterance.voice = this.availableVoices[0];
        
        utterance.onstart = () => { this.aiState = 'speaking'; };
        utterance.onend = () => {
          this.aiState = 'idle';
          if (onEndCallback) onEndCallback();
        };
        window.speechSynthesis.speak(utterance);
      } else if (onEndCallback) onEndCallback();
    },

    async giveConsent() {
      this.modelLoading = true;
      try {
        this.consentGiven = true; await this.$nextTick();
        await new Promise(r => setTimeout(r, 200));
        await this.setupFaceMesh();
        this.modelLoading = false;
        
        this.interviewStarted = true;
        this.currentStep = 0;
        this.currentQuestionText = INITIAL_QUESTIONS[0];
        
        this.chatHistory.push({ role: 'assistant', content: this.currentQuestionText });
        this.speakQuestion(this.currentQuestionText);
        
      } catch (err) {
        this.modelLoading = false; this.consentGiven = false;
        Swal.fire('Kamera Error', 'Izinkan akses kamera terlebih dahulu.', 'error');
      }
    },

    async setupFaceMesh() {
      const videoElement = this.$refs.video;
      if (!videoElement) throw new Error("Video element missing");
      faceMeshInstance = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
      faceMeshInstance.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
      faceMeshInstance.onResults((results) => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          this.faceDetected = true; this.analyzeLandmarks(results.multiFaceLandmarks[0]);
        } else {
          this.faceDetected = false; this.liveTelemetry = { stress: 0, gaze: 'Depan', expression: 'Neutral / Santai' };
        }
      });
      cameraInstance = new Camera(videoElement, {
        onFrame: async () => { if (videoElement && videoElement.readyState >= 2) await faceMeshInstance.send({ image: videoElement }); },
        width: 640, height: 480
      });
      await cameraInstance.start();
    },

    dist(p1, p2) { return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2)); },

    analyzeLandmarks(lm) {
      const leftEyeOuter = lm[33], rightEyeOuter = lm[263];
      const eyeDist = this.dist(leftEyeOuter, rightEyeOuter);
      if (!eyeDist) return;
      const mouthWidthRatio = this.dist(lm[61], lm[291]) / eyeDist;
      
      let stress = 15; let expression = 'Neutral / Santai';
      if (mouthWidthRatio > 0.7) { expression = 'Tegang / Meringis'; stress = 65; }
      else if (mouthWidthRatio > 0.6) { expression = 'Ceria / Senang'; stress = 10; }
      
      this.liveTelemetry = { stress, gaze: 'Depan', expression };
      if (this.interviewStarted && !this.interviewFinished) this.currentQuestionSamples.push({ ...this.liveTelemetry });
    },

    async submitAnswer() {
      const answer = this.currentAnswerText.trim();
      if (!answer) return;

      this.stopListening();
      this.aiState = 'thinking';
      
      this.chatHistory.push({ role: 'user', content: answer });
      this.currentAnswerText = ''; this.baseAnswerText = '';
      this.scrollToBottom();

      const feedback = await this.generateAIResponse(answer);
      
      this.chatHistory.push({ role: 'assistant', content: feedback });
      this.scrollToBottom();

      this.speakQuestion(feedback, async () => {
        this.currentStep++;
        if (this.currentStep < INITIAL_QUESTIONS.length) {
          this.currentQuestionText = INITIAL_QUESTIONS[this.currentStep];
          this.chatHistory.push({ role: 'assistant', content: this.currentQuestionText });
          this.scrollToBottom();
          this.speakQuestion(this.currentQuestionText);
        } else {
          this.interviewFinished = true;
          this.saveResultToBackend();
        }
      });
    },

    async generateAIResponse(userAnswer) {
      const lower = userAnswer.toLowerCase();
      await new Promise(r => setTimeout(r, 1500)); 
      if (lower.includes('stres') || lower.includes('capek')) return "Gua paham bro, wajar banget ngerasa capek.";
      if (lower.includes('senang') || lower.includes('seru')) return "Wah mantap tuh, ikut seneng dengernya!";
      return "Oke, thanks udah mau cerita santai soal ini.";
    },

    async saveResultToBackend() {
      if (cameraInstance) cameraInstance.stop();
      Swal.fire({ title: 'Menyimpan...', icon: 'success', timer: 1500, showConfirmButton: false });
    }
  }
}
</script>
</body>
</html>
